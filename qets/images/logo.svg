    <rect x="58.3" y="60" width="3.4" height="22" rx="1.2"/>
    <path d="M60 46 C 40 48, 30 58, 28 66 C 34 62, 42 60, 48 61 C 40 64, 33 69, 30 76 C 38 71, 46 68, 53 68 C 45 72, 39 78, 37 85 C 46 78, 54 73, 60 72 C 66 73, 74 78, 83 85 C 81 78, 75 72, 67 68 C 74 68, 82 71, 90 76 C 87 69, 80 64, 72 61 C 78 60, 86 62, 92 66 C 90 58, 80 48, 60 46 Z"/>
  </g>

  <!-- ribbon -->
  <path d="M14 92 Q60 108 106 92 L106 100 Q60 116 14 100 Z" fill="rgb(232,163,61)"/>
  <text x="60" y="99.5" text-anchor="middle" font-family="'Bricolage Grotesque', Georgia, serif" font-weight="800" font-size="11" fill="rgb(15,42,46)">QE</text>
</svg>
