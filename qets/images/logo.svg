<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Queen Elizabeth Tours & Safaris emblem">
  <defs>
    <linearGradient id="qeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgb(27,75,79)"/>
      <stop offset="100%" stop-color="rgb(15,42,46)"/>
    </linearGradient>
    <linearGradient id="qeSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgb(232,163,61)"/>
      <stop offset="100%" stop-color="rgb(201,119,47)"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="60" cy="60" r="58" fill="rgb(232,163,61)"/>
  <circle cx="60" cy="60" r="52" fill="url(#qeBg)"/>

  <!-- sun -->
  <circle cx="60" cy="46" r="15" fill="url(#qeSun)"/>

  <!-- distant hills -->
  <path d="M8 86 C 24 72, 34 80, 46 70 C 58 60, 66 76, 80 68 C 94 60, 104 74, 112 70 L 112 100 L 8 100 Z" fill="rgb(15,42,46)"/>

  <!-- acacia tree silhouette, centered -->
